<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6366f1">
  <title>Sem conexão · TODO-NIEL</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #11141d;
      color: #f3f4f6;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(100%, 360px);
      text-align: center;
    }

    p {
      margin: 12px 0 24px;
      color: #a1a1aa;
      line-height: 1.5;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #6366f1;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Você está sem conexão</h1>
    <p>Conecte-se à internet e tente novamente para continuar usando o TODO-NIEL.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
